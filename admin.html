<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Admin Panel — VIP Telecom</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f0ee;--card:#fff;--border:rgba(0,0,0,0.10);--bmd:rgba(0,0,0,0.20);
  --text:#1a1a1a;--muted:#6b6b68;
  --teal:#1D9E75;--teal-dk:#0F6E56;--teal-lt:#EAF3DE;--teal-tx:#27500A;
  --amber-lt:#FAEEDA;--amber-tx:#854F0B;
  --red-lt:#FCEBEB;--red-tx:#A32D2D;
  --r:12px;--rs:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:4rem}
header{background:var(--card);border-bottom:1px solid var(--border);padding:.85rem 1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.hrow{display:flex;align-items:center;gap:10px}
.hico{width:38px;height:38px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header h1{font-size:16px;font-weight:700}
header p{font-size:12px;color:var(--muted)}
.scanner-link{background:var(--teal-lt);color:var(--teal-tx);border:1px solid #97C459;border-radius:var(--rs);padding:7px 13px;font-size:13px;font-weight:600;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.scanner-link:hover{background:#d5ecbc}
.wrap{max-width:480px;margin:0 auto;padding:1rem .9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:.85rem}
.slabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.6rem}
input{width:100%;height:42px;border:1px solid var(--bmd);border-radius:var(--rs);padding:0 12px;font-size:14px;color:var(--text);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(29,158,117,.13)}
input::placeholder{color:#aaa}
.url-row{display:flex;gap:7px}
.url-row input{flex:1}
.sbtn{height:42px;padding:0 14px;background:var(--bg);border:1px solid var(--bmd);border-radius:var(--rs);font-size:13px;cursor:pointer;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:5px;font-weight:600;transition:background .15s}
.sbtn:hover{background:#e4e4e2}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:99px;margin-top:8px;font-weight:500}
.badge.ok{background:var(--teal-lt);color:var(--teal-tx)}
.badge.warn{background:var(--amber-lt);color:var(--amber-tx)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.add-row{display:flex;gap:8px;margin-bottom:1rem}
.add-row input{flex:1}
.add-btn{height:42px;padding:0 18px;background:var(--teal);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background .15s,transform .1s;flex-shrink:0}
.add-btn:hover{background:var(--teal-dk)}
.add-btn:active{transform:scale(.97)}
.add-btn:disabled{background:#9FE1CB;cursor:not-allowed}
.customer-list{display:flex;flex-direction:column;gap:6px}
.customer-item{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--bg);border:1px solid var(--border);border-radius:var(--rs);transition:background .15s}
.customer-item:hover{background:#e8e8e6}
.customer-name{font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:8px}
.customer-num{font-size:11px;color:var(--muted);background:var(--card);border:1px solid var(--border);border-radius:99px;padding:2px 8px;font-weight:600}
.del-btn{width:32px;height:32px;border-radius:8px;background:var(--red-lt);border:1px solid #F09595;color:var(--red-tx);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s}
.del-btn:hover{background:#f8d0d0}
.del-btn:active{transform:scale(.95)}
.del-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty-list{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:14px}
.empty-list svg{width:32px;height:32px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.3;display:block;margin:0 auto 8px}
.loading-list{padding:1.5rem;text-align:center;color:var(--muted);font-size:14px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:.85rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
.stat-lbl{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:4px}
.stat-val{font-size:26px;font-weight:700;color:var(--teal)}
.toast-area{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);z-index:100;pointer-events:none;min-width:200px}
.tmsg{padding:10px 18px;border-radius:var(--rs);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;opacity:0;transition:opacity .3s;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.tmsg.show{opacity:1}
.tmsg.success{background:#1D9E75;color:#fff}
.tmsg.error{background:#E24B4A;color:#fff}
.refresh-btn{display:flex;align-items:center;gap:6px;background:none;border:1px solid var(--border);border-radius:var(--rs);padding:6px 12px;font-size:12px;color:var(--muted);cursor:pointer;transition:background .15s;font-weight:500;margin-bottom:1rem}
.refresh-btn:hover{background:var(--bg)}
.refresh-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="hico">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    </div>
    <div>
      <h1>Admin Panel</h1>
      <p>Manage customer list</p>
    </div>
  </div>
  <a href="index.html" class="scanner-link">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="4" height="18" rx="1"/><rect x="9" y="3" width="2" height="18" rx="1"/><rect x="13" y="3" width="4" height="18" rx="1"/><rect x="19" y="3" width="2" height="18" rx="1"/></svg>
    Scanner
  </a>
</header>

<div class="wrap">

  <!-- URL CONFIG -->
  <div class="card">
    <div class="slabel">Google Apps Script Web App URL</div>
    <div class="url-row">
      <input type="url" id="webAppUrl" placeholder="https://script.google.com/macros/s/.../exec"/>
      <button class="sbtn" onclick="saveUrl()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save
      </button>
    </div>
    <div id="urlStatus" class="badge warn"><span class="dot"></span>URL not configured</div>
  </div>

  <!-- STATS -->
  <div class="stat-row">
    <div class="stat"><div class="stat-lbl">Total Customers</div><div class="stat-val" id="totalCustomers">—</div></div>
    <div class="stat"><div class="stat-lbl">Last Added</div><div class="stat-val" style="font-size:14px;padding-top:4px" id="lastAdded">—</div></div>
  </div>

  <!-- ADD CUSTOMER -->
  <div class="card">
    <div class="slabel">Add new customer</div>
    <div class="add-row">
      <input type="text" id="newCustomer" placeholder="Enter customer name" onkeydown="if(event.key==='Enter') addCustomer()"/>
      <button class="add-btn" id="addBtn" onclick="addCustomer()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add
      </button>
    </div>
  </div>

  <!-- CUSTOMER LIST -->
  <div class="card">
    <div class="slabel">Customer list</div>
    <button class="refresh-btn" onclick="loadCustomers()">
      <svg id="refreshIcon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh list
    </button>
    <div id="customerList" class="loading-list">Loading customers…</div>
  </div>

</div>

<div class="toast-area"><div class="tmsg" id="toast"></div></div>

<script>
let customers = [];

function saveUrl(){
  const url = document.getElementById('webAppUrl').value.trim();
  if(!url.startsWith('https://script.google.com')){showToast('Please enter a valid Apps Script URL','error');return;}
  localStorage.setItem('gasUrl', url);
  updateBadge(true);
  showToast('URL saved!','success');
  loadCustomers();
}
function updateBadge(ok){
  const el = document.getElementById('urlStatus');
  el.className = 'badge '+(ok?'ok':'warn');
  el.innerHTML = '<span class="dot"></span>'+(ok?'URL configured ✓':'URL not configured');
}

async function loadCustomers(){
  const url = localStorage.getItem('gasUrl');
  if(!url){renderList();return;}
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('spin');
  document.getElementById('customerList').innerHTML = '<div class="loading-list">Loading customers…</div>';
  try{
    const res = await fetch(url+'?action=getCustomers', {method:'GET', mode:'cors'});
    const data = await res.json();
    if(data.customers){
      customers = data.customers;
      renderList();
      document.getElementById('totalCustomers').textContent = customers.length;
      document.getElementById('lastAdded').textContent = customers.length ? customers[customers.length-1] : '—';
    }
  }catch(e){
    showToast('Failed to load — check URL','error');
    renderList();
  }
  icon.classList.remove('spin');
}

async function addCustomer(){
  const url = localStorage.getItem('gasUrl');
  if(!url){showToast('Configure Apps Script URL first','error');return;}
  const name = document.getElementById('newCustomer').value.trim();
  if(!name){showToast('Please enter a customer name','error');return;}
  if(customers.map(c=>c.toLowerCase()).includes(name.toLowerCase())){showToast('Customer already exists!','error');return;}

  const btn = document.getElementById('addBtn');
  btn.disabled = true;
  btn.innerHTML = '⏳';

  try{
    const res = await fetch(url, {
      method:'POST', mode:'cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'addCustomer', name})
    });
    const data = await res.json();
    if(data.status==='success'){
      customers.push(name);
      document.getElementById('newCustomer').value = '';
      renderList();
      document.getElementById('totalCustomers').textContent = customers.length;
      document.getElementById('lastAdded').textContent = name;
      showToast('✓ Customer added!','success');
    } else {
      showToast('Error: '+data.message,'error');
    }
  }catch(e){
    showToast('Network error — try again','error');
  }
  btn.disabled = false;
  btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add';
}

async function deleteCustomer(name, idx){
  const url = localStorage.getItem('gasUrl');
  if(!url){showToast('Configure Apps Script URL first','error');return;}
  if(!confirm('Delete "'+name+'"?')) return;

  try{
    const res = await fetch(url, {
      method:'POST', mode:'cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action:'deleteCustomer', name})
    });
    const data = await res.json();
    if(data.status==='success'){
      customers.splice(idx,1);
      renderList();
      document.getElementById('totalCustomers').textContent = customers.length;
      document.getElementById('lastAdded').textContent = customers.length ? customers[customers.length-1] : '—';
      showToast('✓ Customer deleted!','success');
    } else {
      showToast('Error: '+data.message,'error');
    }
  }catch(e){
    showToast('Network error — try again','error');
  }
}

function renderList(){
  const c = document.getElementById('customerList');
  if(!customers.length){
    c.innerHTML = '<div class="empty-list"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>No customers yet — add one above</div>';
    return;
  }
  c.innerHTML = '<div class="customer-list">'+
    customers.map((name,i)=>`
      <div class="customer-item">
        <div class="customer-name">
          <span class="customer-num">${i+1}</span>
          ${name}
        </div>
        <button class="del-btn" onclick="deleteCustomer('${name.replace(/'/g,"\\'")}',${i})" title="Delete">
          <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>`).join('')+
  '</div>';
}

function showToast(msg, type){
  const el = document.getElementById('toast');
  el.className = 'tmsg '+type+' show';
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.className='tmsg',3000);
}

// INIT
const saved = localStorage.getItem('gasUrl');
if(saved){document.getElementById('webAppUrl').value=saved;updateBadge(true);loadCustomers();}
else{renderList();}
</script>
</body>
</html>
